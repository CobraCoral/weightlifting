<title>IRON LOG</title>
<style>
  :root {
    --bg:#080d18;--bg2:rgba(255,255,255,0.025);--border:rgba(255,255,255,0.07);
    --text:#e2e8f0;--muted:#475569;--dim:#334155;--font:'DM Mono','Fira Code',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;max-width:680px;margin:0 auto;padding-bottom:80px;}

/* ── Header ── */
.header{padding:14px 14px 10px;border-bottom:1px solid var(–border);display:flex;justify-content:space-between;align-items:center;}
.title{font-size:14px;font-weight:800;letter-spacing:.22em;color:#f8fafc;}
.sub{font-size:10px;color:var(–muted);margin-top:2px;}
.dot{color:#22c55e;margin-left:8px;font-size:9px;}
.nav-btns{display:flex;gap:4px;}
.nav-btn{background:none;border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:5px 11px;color:var(–muted);font-family:var(–font);font-size:10px;font-weight:700;letter-spacing:.1em;cursor:pointer;}
.nav-btn.active{background:rgba(255,255,255,.08);color:var(–text);border-color:rgba(255,255,255,.2);}

/* ── Week strip ── */
.strip{display:flex;border-bottom:1px solid rgba(255,255,255,.05);}
.strip-cell{flex:1;padding:7px 2px;text-align:center;opacity:.35;}
.strip-cell.lift{opacity:1;cursor:pointer;}
.strip-d{font-size:10px;font-weight:800;}
.strip-l{font-size:9px;color:var(–muted);margin-top:1px;}

/* ── Day tabs ── */
.day-tabs{display:flex;gap:5px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap;}
.day-tab{flex:1;min-width:85px;background:none;border:1px solid var(–border);border-radius:8px;padding:7px 6px;color:#64748b;font-family:var(–font);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;transition:all .15s;}
.day-tab-d{font-size:9px;letter-spacing:.08em;}
.day-tab-l{font-size:10px;font-weight:700;}

/* ── Exercise list ── */
.ex-list{padding:9px 14px;display:flex;flex-direction:column;gap:10px;}
.card{background:var(–bg2);border:1px solid var(–border);border-radius:10px;padding:11px;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.ex-name{font-size:12px;font-weight:700;color:#f1f5f9;}
.ex-alt{font-size:10px;color:var(–muted);margin-top:1px;}
.ex-target{font-size:10px;font-weight:600;text-align:right;}

/* ── Timing bar ── */
.ex-timing{display:flex;gap:12px;margin-bottom:7px;padding:5px 8px;background:rgba(255,255,255,.03);border-radius:6px;border:1px solid rgba(255,255,255,.05);}
.timing-item{display:flex;flex-direction:column;gap:1px;}
.timing-label{font-size:8px;color:var(–muted);letter-spacing:.08em;text-transform:uppercase;}
.timing-val{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}

/* ── Set rows ── */
.set-header{display:flex;gap:5px;margin-bottom:3px;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,.05);}
.sh{font-size:9px;color:var(–dim);letter-spacing:.06em;flex-shrink:0;}
.set-row{display:flex;align-items:center;gap:5px;padding:3px 0;border-radius:4px;}
.set-num{width:22px;font-size:10px;text-align:center;flex-shrink:0;font-weight:700;}
.set-input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:5px;padding:5px;font-family:var(–font);font-size:12px;text-align:center;outline:none;color:#e2e8f0;-webkit-text-fill-color:#e2e8f0;width:68px;-moz-appearance:textfield;}
.set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.chk-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(–dim);cursor:pointer;font-weight:700;font-size:12px;flex-shrink:0;transition:all .15s;color:#0a0f1a;background:transparent;font-family:var(–font);}
.rm-btn{display:none;} /* hidden — replaced by swipe-to-delete */

/* ── Swipe-to-delete ── */
.swipe-wrap{position:relative;overflow:hidden;border-radius:4px;margin:1px 0;}
.swipe-delete-bg{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;border-radius:4px;pointer-events:none;min-width:80px;}
.swipe-delete-label{font-size:10px;font-weight:800;letter-spacing:.08em;color:#fff;opacity:0;transition:opacity .1s;}
.swipe-inner{position:relative;transition:transform .2s cubic-bezier(.25,.46,.45,.94);touch-action:pan-y;will-change:transform;}
.set-time{font-size:9px;color:var(–muted);flex-shrink:0;white-space:nowrap;}

/* ── Rest / exercise badges ── */
.badge-row{display:flex;gap:6px;align-items:center;margin:2px 0 2px 27px;}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid;font-variant-numeric:tabular-nums;white-space:nowrap;}
.badge-rest{color:var(–muted);border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.03);}
.badge-rest.short{color:#4ade80;border-color:#4ade8040;background:#4ade8010;}
.badge-rest.medium{color:#fb923c;border-color:#fb923c40;background:#fb923c10;}
.badge-rest.long{color:#f87171;border-color:#f8717140;background:#f8717110;}
.badge-ex{color:var(–muted);border-color:rgba(255,255,255,.06);background:rgba(255,255,255,.02);}

/* ── Start set button ── */
.start-set-btn{font-size:10px;padding:3px 9px;border-radius:4px;border:1px dashed;cursor:pointer;background:none;font-family:var(–font);font-weight:600;white-space:nowrap;}

.add-btn{margin-top:6px;background:none;border:1px dashed;border-radius:6px;padding:4px 10px;font-family:var(–font);font-size:11px;cursor:pointer;width:100%;}
.action-row{padding:12px 14px 0;display:flex;justify-content:flex-end;gap:8px;align-items:center;}
.save-btn{padding:9px 22px;border-radius:8px;border:none;font-family:var(–font);font-size:12px;font-weight:800;letter-spacing:.12em;cursor:pointer;transition:all .2s;}
.exp-btn{padding:7px 11px;border-radius:8px;border:1px solid;background:none;font-family:var(–font);font-size:11px;font-weight:700;cursor:pointer;}
.toast{margin:9px 14px 0;padding:9px 14px;border-radius:8px;border:1px solid;background:rgba(0,0,0,.85);font-size:12px;font-weight:700;text-align:center;display:none;}
.toast.show{display:block;}
.loading{padding:32px;text-align:center;color:var(–muted);font-size:12px;}

/* ── History ── */
.hist-wrap{padding:12px 14px;}
.hist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;}
.hist-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.hist-tab{background:none;border:1px solid var(–border);border-radius:6px;padding:5px 9px;color:var(–muted);font-family:var(–font);font-size:11px;cursor:pointer;font-weight:600;}
.hist-card{background:var(–bg2);border:1px solid var(–border);border-radius:10px;padding:11px;margin-bottom:7px;cursor:pointer;}
.hist-date{font-size:13px;font-weight:700;color:#f1f5f9;}
.hist-day-lbl{font-size:11px;margin-top:2px;}
.hist-body{margin-top:10px;display:none;}
.hist-body.open{display:block;}
.hist-ex{margin-bottom:8px;}
.hist-ex-name{font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:3px;}
.hist-sets{display:flex;flex-wrap:wrap;gap:4px;}
.hist-set{font-size:11px;padding:2px 7px;border-radius:4px;font-variant-numeric:tabular-nums;}
.empty{color:var(–dim);text-align:center;margin-top:40px;font-size:13px;}

/* ── WMA Chart Modal ── */
.chart-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;justify-content:center;align-items:flex-end;}
.chart-modal-overlay.open{display:flex;}
.chart-modal{background:#0d1525;border:1px solid rgba(255,255,255,.09);border-radius:14px 14px 0 0;padding:20px 16px 36px;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;}
.chart-modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.chart-ex-title{font-size:13px;font-weight:700;color:#f1f5f9;}
.chart-ex-sub{font-size:10px;color:var(–muted);margin-top:2px;}
.chart-controls{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.chart-ctrl-btn{background:none;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px 10px;font-family:var(–font);font-size:10px;font-weight:700;cursor:pointer;color:var(–muted);}
.chart-ctrl-btn.active{border-color:#60a5fa;color:#60a5fa;background:rgba(96,165,250,.12);}
.chart-canvas-wrap{position:relative;width:100%;margin-bottom:12px;}
canvas#wma-canvas{width:100%;display:block;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);}
.chart-legend{display:flex;gap:14px;font-size:10px;color:var(–muted);margin-bottom:12px;flex-wrap:wrap;}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.chart-stats-row{display:flex;gap:8px;flex-wrap:wrap;}
.chart-stat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 12px;flex:1;min-width:90px;}
.chart-stat-label{font-size:9px;color:var(–muted);letter-spacing:.08em;margin-bottom:3px;}
.chart-stat-val{font-size:16px;font-weight:800;color:#f1f5f9;}
.chart-stat-sub{font-size:9px;color:var(–dim);margin-top:1px;}
.prog-btn{background:none;border:none;color:var(–muted);font-size:12px;cursor:pointer;padding:1px 5px;border-radius:4px;border:1px solid rgba(255,255,255,.08);white-space:nowrap;margin-left:6px;}
.prog-btn:hover{color:#60a5fa;border-color:rgba(96,165,250,.3);}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal{background:#0f1829;border:1px solid var(–border);border-radius:14px 14px 0 0;padding:20px 16px 32px;width:100%;max-width:680px;}
.modal-title{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:14px;}
.modal-field{margin-bottom:10px;}
.modal-label{font-size:10px;color:var(–muted);letter-spacing:.08em;margin-bottom:4px;text-transform:uppercase;}
.modal-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:8px 10px;color:var(–text);font-family:var(–font);font-size:12px;outline:none;}
.modal-row{display:flex;gap:8px;}
.modal-row .modal-field{flex:1;}
.modal-btns{display:flex;gap:8px;margin-top:16px;}
.modal-btn{flex:1;padding:10px;border-radius:8px;border:none;font-family:var(–font);font-size:12px;font-weight:700;cursor:pointer;}
.modal-btn-cancel{background:rgba(255,255,255,.06);color:var(–muted);}
.modal-btn-save{color:#0a0f1a;}

/* ── Section header with + button ── */
.day-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 14px 0;}
.day-summary .ds-tile{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:7px 4px;text-align:center;min-width:0;}
.day-summary .ds-val{font-size:13px;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.day-summary .ds-lbl{font-size:11px;color:#64748b;margin-top:2px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-section-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 2px;}
.ex-section-label{font-size:9px;color:var(–muted);letter-spacing:.12em;text-transform:uppercase;}
.add-ex-btn{background:none;border:1px solid;border-radius:6px;padding:4px 10px;font-family:var(–font);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.06em;}

/* ── Reorder mode ── */
.reorder-btn{background:none;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:4px 10px;font-family:var(–font);font-size:11px;font-weight:700;cursor:pointer;color:var(–muted);letter-spacing:.06em;margin-right:6px;}
.reorder-btn.active{background:rgba(96,165,250,.18);border-color:#60a5fa;color:#60a5fa;}
body.reordering .ex-timing,
body.reordering .set-header,
body.reordering .swipe-wrap,
body.reordering .add-btn,
body.reordering .card-edit-btn{display:none!important;}
body.reordering .card{padding:9px 11px;cursor:grab;}
body.reordering .card-head{margin-bottom:0;}
.reorder-controls{display:none;margin-top:6px;gap:6px;align-items:center;}
body.reordering .reorder-controls{display:flex;}
.reorder-arrow{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:8px;font-family:var(–font);font-size:14px;font-weight:700;cursor:pointer;color:#94a3b8;}
.reorder-arrow:active{background:rgba(96,165,250,.2);color:#60a5fa;}
.reorder-arrow:disabled{opacity:.25;cursor:not-allowed;}
.reorder-banner{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);border-radius:8px;padding:8px 12px;margin:6px 14px 0;font-size:11px;color:#60a5fa;display:none;text-align:center;letter-spacing:.04em;}
body.reordering .reorder-banner{display:block;}

/* ── Edit pencil on card ── */
.card-edit-btn{background:none;border:none;color:var(–muted);font-size:13px;cursor:pointer;padding:0 2px;line-height:1;margin-left:4px;}
.card-edit-btn:hover{color:var(–text);}

</style>
</head>
<body>

<div class="header">
  <div>
    <div class="title">IRON LOG</div>
    <div class="sub"><span id="today-label"></span><span class="dot">● SUPABASE</span></div>
  </div>
  <div class="nav-btns">
    <button class="nav-btn active" onclick="switchView('log')" id="btn-log">LOG</button>
    <button class="nav-btn" onclick="switchView('history')" id="btn-history">HISTORY</button>
  </div>
</div>

<div class="strip" id="week-strip"></div>

<div id="view-log">
  <div class="day-tabs" id="day-tabs"></div>
  <div class="day-summary" id="day-summary" aria-live="polite"></div>
  <div class="ex-section-header">
    <span class="ex-section-label">EXERCISES</span>
    <div>
      <button class="reorder-btn" id="reorder-btn" onclick="toggleReorderMode()">🔀 reorder</button>
      <button class="add-ex-btn" id="add-ex-btn" onclick="openAddModal()">+ add exercise</button>
    </div>
  </div>
  <div class="reorder-banner" id="reorder-banner">Reorder mode — use ↑ ↓ to move exercises, then tap Done</div>
  <div id="ex-loading" class="loading" style="display:none">Loading from Supabase...</div>
  <div class="ex-list" id="ex-list"></div>
  <div class="action-row">
    <button class="exp-btn" id="whoop-btn" onclick="copyForWhoop()">copy WHOOP</button>
    <button class="exp-btn" id="csv-btn" onclick="exportCSV()">export CSV</button>
    <button class="save-btn" id="save-btn" onclick="saveSession()">SAVE</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<!-- ── Add / Edit Exercise Modal ── -->

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add Exercise</div>
    <div class="modal-field">
      <div class="modal-label">Exercise Name</div>
      <input class="modal-input" id="modal-name" placeholder="e.g. Leg Press" type="text">
    </div>
    <div class="modal-field">
      <div class="modal-label">Alternate Name (optional)</div>
      <input class="modal-input" id="modal-alt" placeholder="e.g. Hack Squat" type="text">
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <div class="modal-label">Sets</div>
        <input class="modal-input" id="modal-sets" placeholder="3" type="number" min="1" max="10">
      </div>
      <div class="modal-field">
        <div class="modal-label">Rep Target</div>
        <input class="modal-input" id="modal-reps" placeholder="8-10" type="text">
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <div class="modal-label">Default Weight</div>
        <input class="modal-input" id="modal-weight" placeholder="135" type="number">
      </div>
      <div class="modal-field">
        <div class="modal-label">Unit</div>
        <input class="modal-input" id="modal-unit" placeholder="lb" type="text">
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>

let histData    = [];
let liveTimer   = null;

// ─── Helpers ─────────────────────────────────────────────────────────────────
function todayKey(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ── Silent localStorage draft persistence ──
const DRAFT_PREFIX='ironlog_draft_';
function draftKey(){ return `${DRAFT_PREFIX}${currentDay}_${todayKey()}`; }
function saveDraftLocal(){ try{ localStorage.setItem(draftKey(),JSON.stringify(draft)); }catch{} }
function clearDraftLocal(){ try{ localStorage.removeItem(draftKey()); }catch{} }
function loadDraftLocal(){ try{ const raw=localStorage.getItem(draftKey()); return raw?JSON.parse(raw):null; }catch{ return null; } }
function pruneOldDrafts(){ try{ const today=todayKey(); for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k&&k.startsWith(DRAFT_PREFIX)&&!k.endsWith(today)) localStorage.removeItem(k); } }catch{} }
function fmtDate(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function fmtShort(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtSecs(s){
  if(s==null||isNaN(s)||s<0) return '—';
  if(s<60) return `${s}s`;
  return `${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`;
}
function fmtTime(iso){ return iso ? new Date(iso).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : ''; }
function restClass(s){ if(s<=90) return 'short'; if(s<=180) return 'medium'; return 'long'; }

function makeDefaultDraft(day){
  const d={};
  PROGRAM[day].exercises.forEach(ex=>{
    d[ex.id]=Array.from({length:ex.ds},()=>({w:ex.dw===0?'':String(ex.dw),r:'',done:false,startedAt:null,completedAt:null}));
  });
  return d;
}

// Build the target badge from actual draft data (last session weights/reps)
// Falls back to static program target if no real data exists
function buildTargetBadge(ex){
  const sets = draft[ex.id];
  if(!sets || !sets.length) return `${ex.rt}${ex.u?' · '+ex.u:''}`;

  // Collect non-empty weights and reps (allow negative for assisted exercises)
  const weights = sets.map(s=>parseFloat(s.w)).filter(v=>!isNaN(v)&&v!==0);
  const reps    = sets.map(s=>parseFloat(s.r)).filter(v=>!isNaN(v)&&v>0);
  const nSets   = sets.length;

  // If nothing filled in yet, show static target
  if(!weights.length && !reps.length) return `${ex.rt}${ex.u?' · '+ex.u:''}`;

  // Sets count
  const setsStr = `${nSets}×`;

  // Reps: show range if varied, single value if uniform, target if missing
  let repsStr = ex.rt;
  if(reps.length){
    const minR = Math.min(...reps), maxR = Math.max(...reps);
    repsStr = minR===maxR ? String(minR) : `${minR}–${maxR}`;
  }

  // Weight: show top set with unit
  // For assisted exercises (all negative), top = closest to zero (least assist)
  // For regular exercises, top = max
  let weightStr = '';
  if(weights.length){
    const allNeg = weights.every(w=>w<0);
    const topW = allNeg ? Math.max(...weights) : Math.max(...weights);
    // Format: drop trailing .0 but keep .5
    const fmt = v => Number.isInteger(v) ? String(v) : v.toFixed(1).replace(/\.0$/,'');
    weightStr = ` / ${fmt(topW)}${ex.u?' '+ex.u:''}`;
  } else if(ex.u){
    weightStr = ` · ${ex.u}`;
  }

  return `${setsStr}${repsStr}${weightStr}`;
}

// ─── Timing calculations ──────────────────────────────────────────────────────
// REST = time from previous set's completedAt → this set's startedAt
// EXERCISE = time from this set's startedAt → this set's completedAt
function getRestSecs(prevSet, thisSet){
  if(!prevSet?.completedAt || !thisSet?.startedAt) return null;
  return Math.round((new Date(thisSet.startedAt) - new Date(prevSet.completedAt))/1000);
}
function getExSecs(thisSet){
  if(!thisSet?.startedAt || !thisSet?.completedAt) return null;
  return Math.round((new Date(thisSet.completedAt) - new Date(thisSet.startedAt))/1000);
}
function getLiveRestSecs(prevSet){
  if(!prevSet?.completedAt) return null;
  return Math.round((Date.now() - new Date(prevSet.completedAt))/1000);
}

// ─── Progression engine (double progression) ──────────────────────────────────
// Rule: each session try to add reps at the same weight until EVERY working set
// reaches the top of the exercise's rep range (parsed from ex.rt, e.g. "8-12").
// Once all sets hit the ceiling, bump the weight by the step and rebuild reps
// from the range floor. Weight step defaults to 5; the cable stack steps by 1.5.
// Edit PROG_STEP_OVERRIDES (by exact exercise name) to tune increments.
const PROG_STEP_DEFAULT = 5;
const PROG_STEP_OVERRIDES = {
  'Rope Triceps Pushdowns'          : 1.5,
  'Overhead Rope Tricep Ext.'       : 1.5,
  'Lean-Away Cable Lateral Raises (60/75deg)': 2.5,
  'Single-Hand Cable Traps'         : 2.5,
  'Lat Pulldown'                    : 5,
};
function progStep(ex){
  if(ex && Object.prototype.hasOwnProperty.call(PROG_STEP_OVERRIDES, ex.name)) return PROG_STEP_OVERRIDES[ex.name];
  return PROG_STEP_DEFAULT;
}
function parseRepRange(rt){
  if(rt==null) return null;
  const nums = String(rt).match(/\d+(\.\d+)?/g);
  if(!nums || !nums.length) return null;
  const a = parseFloat(nums[0]);
  const b = nums.length>1 ? parseFloat(nums[1]) : a;
  return { lo: Math.min(a,b), hi: Math.max(a,b) };
}
function progFmtW(v){ return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/,'').replace(/\.$/,''); }
// history rows -> { exercise_id: [ newestSession[], prevSession[] ] }, each session = [{w,r}] by set
function sessionsByExercise(rows){
  const byEx = {};
  (rows||[]).forEach(r=>{
    if(r.exercise_id==null) return;
    (byEx[r.exercise_id] ||= {})[r.date] ||= [];
    byEx[r.exercise_id][r.date].push(r);
  });
  const out = {};
  Object.entries(byEx).forEach(([id, byDate])=>{
    const dates = Object.keys(byDate).sort().reverse();
    out[id] = dates.slice(0,2).map(d =>
      byDate[d].sort((a,b)=>a.set_number-b.set_number)
        .map(s=>({ w: parseFloat(s.weight), r: parseFloat(s.reps) }))
        .filter(s=>!isNaN(s.r))
    );
  });
  return out;
}
function computeSuggestions(rows, day){
  const exs  = (PROGRAM[day] && PROGRAM[day].exercises) || [];
  const hist = sessionsByExercise(rows);
  const res  = {};
  exs.forEach(ex=>{
    const sessions = hist[ex.id];
    if(!sessions || !sessions.length) return;                 // no history -> no suggestion
    const last    = sessions[0];
    const prev    = sessions[1] || null;
    const working = last.filter(s=>!isNaN(s.w));               // sets that carried a load
    if(!working.length) return;
    const range = parseRepRange(ex.rt) || { lo:null, hi:null };
    const hi    = range.hi;
    const step  = progStep(ex);
    const aimStr = (range.lo!=null && hi!=null)
      ? (range.lo===hi ? `${hi}` : `${range.lo}\u2013${hi}`) : '';

    let mode, sets;
    const allAtCeiling = hi!=null && working.every(s=>s.r>=hi);
    if(allAtCeiling){
      mode = 'increase';                                       // top of range on every set -> add load
      sets = working.map(s=>({ w:+(s.w+step).toFixed(2), r:(range.lo!=null?range.lo:Math.max(1,hi-3)) }));
    } else {
      mode = 'progress';                                       // hold load, chase +1 rep/set
      sets = working.map(s=>({ w:s.w, r:(hi!=null?Math.min(s.r+1,hi):s.r+1) }));
      if(prev){                                                // stall = identical to the session before
        const pw = prev.filter(s=>!isNaN(s.w));
        const same = pw.length===working.length && working.every((s,i)=>pw[i]&&pw[i].w===s.w&&pw[i].r===s.r);
        if(same) mode = 'stall';
      }
    }
    const topW   = Math.max(...sets.map(s=>s.w));
    const repStr = sets.map(s=>s.r).join(',');
    const unit   = ex.u ? ' '+ex.u : '';
    const text =
      mode==='increase' ? `\u2191 ${progFmtW(topW)}${unit} \u00b7 rebuild reps${aimStr?' to '+aimStr:''}` :
      mode==='stall'    ? `\u26a1 stalled \u00b7 hold ${progFmtW(topW)}${unit}, add a set or small back-off` :
                          `\u2192 ${progFmtW(topW)}${unit} \u00d7 ${repStr}`;
    res[ex.id] = { mode, sets, text,
      color: mode==='increase' ? '#4ade80' : mode==='stall' ? '#fbbf24' : '#60a5fa' };
  });
  return res;
}
// Fresh draft (done/timers cleared) prefilled with the suggested weight + target reps.
function suggestionsToFreshDraft(day){
  const d = makeDefaultDraft(day);
  ((PROGRAM[day] && PROGRAM[day].exercises) || []).forEach(ex=>{
    const s = suggestions[ex.id];
    if(s && s.sets && s.sets.length){
      d[ex.id] = s.sets.map(x=>({
        w: (x.w!=null && !isNaN(x.w)) ? String(x.w) : '',
        r: (x.r!=null && !isNaN(x.r)) ? String(x.r) : '',
        done:false, startedAt:null, completedAt:null
      }));
    }
  });
  return d;
}

function exStats(sets){
  const doneSets = sets.filter(s=>s.done&&s.startedAt&&s.completedAt);
  if(!doneSets.length) return null;
  const allTs = doneSets.flatMap(s=>[new Date(s.startedAt).getTime(), new Date(s.completedAt).getTime()]);
  const totalTime = Math.round((Math.max(...allTs)-Math.min(...allTs))/1000);
  const rests = [];
  for(let i=1;i<sets.length;i++){
    const r=getRestSecs(sets[i-1],sets[i]);
    if(r!=null) rests.push(r);
  }
  const avgRest = rests.length ? Math.round(rests.reduce((a,b)=>a+b,0)/rests.length) : null;
  return {totalTime, avgRest, done:doneSets.length, total:sets.length};
}

// ─── Draft ↔ DB conversion ────────────────────────────────────────────────────
function draftToRows(day,date){
  const rows=[];
  const skipped=[];
  PROGRAM[day].exercises.forEach(ex=>{
    // Guard: exercise_id MUST be a number from the DB. If it isn't, skip the rows
    // and warn the user — this prevents NOT NULL constraint violations on save.
    if (typeof ex.id !== 'number') {
      skipped.push(ex.name);
      return;
    }
    (draft[ex.id]||[]).forEach((st,i)=>{
      // Only persist sets the user actually engaged with (started ▶ or marked done ✓).
      // Prevents prefilled progression suggestions from being saved as a phantom session.
      if(!st.done && !st.startedAt) return;
      rows.push({date,day,exercise_id:ex.id,exercise:ex.name,set_number:i+1,weight:st.w||null,reps:st.r||null,done:st.done,started_at:st.startedAt||null,completed_at:st.completedAt||null});
    });
  });
  if (skipped.length) {
    console.warn('Skipped exercises without DB id:', skipped);
    showToast(`Skipped ${skipped.length} unsaved exercise${skipped.length>1?'s':''}: ${skipped.join(', ')}`,'#fb923c');
  }
  return rows;
}

function rowsToDraft(rows,day){
  const d=makeDefaultDraft(day);
  PROGRAM[day].exercises.forEach(ex=>{
    const er=rows.filter(r=>r.exercise_id===ex.id).sort((a,b)=>a.set_number-b.set_number);
    if(er.length>0) d[ex.id]=er.map(r=>({w:r.weight||'',r:r.reps||'',done:r.done,startedAt:r.started_at||null,completedAt:r.completed_at||null}));
  });
  return d;
}

// Pre-fills weights/reps from a previous session, but clears done/timestamps
function rowsToFreshDraft(rows,day){

    const er=rows.filter(r=>r.exercise_id===ex.id).sort((a,b)=>a.set_number-b.set_number);

  return d;
}

// ─── Day summary (whole-session header) ───────────────────────────────────────
// Aggregates every completed set across all exercises for the current day.
//   total time    = first set start → last set finish (session wall clock)
//   avg set time  = mean(completedAt − startedAt) over completed sets
//   avg rest/set  = mean gap between consecutive completed sets, in chronological
//                   order across the whole day (same definition as the per-card rest)
//   volume load   = Σ weight × reps for loaded sets; bodyweight/assisted (weight ≤ 0)
//                   are excluded. Per-hand units (e.g. "lb/hand") count both hands.
const VOLUME_COUNT_BOTH_HANDS = true;
function fmtSecs(s){
  if(s==null || isNaN(s)) return '\u2014';
  const m=Math.floor(s/60), r=Math.round(s%60);
  if(m>=60) return `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}m`;
  return `${m}:${String(r).padStart(2,'0')}`;
}
function dayStats(day){
  const exs=(PROGRAM[day]&&PROGRAM[day].exercises)||[];
  const done=[]; let totalSets=0;
  exs.forEach(ex=>{
    const sets=draft[ex.id]||[]; totalSets+=sets.length;
    const perHand=/\/hand/i.test(ex.u||'');
    sets.forEach(s=>{
      if(!(s.done&&s.startedAt&&s.completedAt)) return;
      const st=new Date(s.startedAt).getTime(), en=new Date(s.completedAt).getTime();
      if(isNaN(st)||isNaN(en)||en<st) return;
      const w=parseFloat(s.w), r=parseFloat(s.r);
      const vol=(w>0&&r>0)?w*r*((VOLUME_COUNT_BOTH_HANDS&&perHand)?2:1):0;
      done.push({st,en,vol});
    });
  });
  if(!done.length) return {totalTime:null,avgRest:null,avgSet:null,volume:0,done:0,total:totalSets};
  done.sort((a,b)=>a.st-b.st);
  const totalTime=Math.round((Math.max(...done.map(d=>d.en))-Math.min(...done.map(d=>d.st)))/1000);
  const avgSet=Math.round(done.reduce((a,d)=>a+(d.en-d.st),0)/done.length/1000);
  const rests=[];
  for(let i=1;i<done.length;i++){ const g=(done[i].st-done[i-1].en)/1000; if(g>0) rests.push(g); }
  const avgRest=rests.length?Math.round(rests.reduce((a,b)=>a+b,0)/rests.length):null;
  const volume=done.reduce((a,d)=>a+d.vol,0);
  return {totalTime,avgRest,avgSet,volume,done:done.length,total:totalSets};
}
function renderDaySummary(){
  const el=document.getElementById('day-summary'); if(!el) return;
  const s=dayStats(currentDay);
  const volStr=s.volume>0 ? Math.round(s.volume).toLocaleString()+' lb' : '\u2014';
  // All interpolated values are numbers/formatted strings — no user text, no escaping needed.
  el.innerHTML=`
    <div class="ds-tile"><div class="ds-val">${fmtSecs(s.totalTime)}</div><div class="ds-lbl">total \u00b7 ${s.done}/${s.total} sets</div></div>
    <div class="ds-tile"><div class="ds-val">${fmtSecs(s.avgRest)}</div><div class="ds-lbl">avg rest/set</div></div>
    <div class="ds-tile"><div class="ds-val">${fmtSecs(s.avgSet)}</div><div class="ds-lbl">avg set time</div></div>
    <div class="ds-tile"><div class="ds-val">${volStr}</div><div class="ds-lbl">volume load</div></div>`;
}

function renderExercises(){
  renderDaySummary();
  const prog=PROGRAM[currentDay], ac=prog.accent;
  document.getElementById('ex-list').innerHTML = prog.exercises.map(ex=>{
    const sets=draft[ex.id]||[];
    const stats=exStats(sets);

    // Timing summary bar
    let timingBar='';
    if(stats){
      const col = stats.done===stats.total ? ac : 'var(--muted)';
      timingBar=`<div class="ex-timing">
        <div class="timing-item"><div class="timing-label">TOTAL TIME</div><div class="timing-val" style="color:${col}">${fmtSecs(stats.totalTime)}</div></div>
        <div class="timing-item"><div class="timing-label">AVG REST</div><div class="timing-val" style="color:var(--muted)">${stats.avgRest!=null?fmtSecs(stats.avgRest):'—'}</div></div>
        <div class="timing-item"><div class="timing-label">SETS DONE</div><div class="timing-val" style="color:var(--muted)">${stats.done}/${stats.total}</div></div>
      </div>`;
    }

    let setsHtml='';
    sets.forEach((st,si)=>{
      const prev = si>0 ? sets[si-1] : null;

      // ── Between-set badges ──
      if(prev){
        const restSecs  = getRestSecs(prev, st);       // rest = prev.completedAt → this.startedAt
        const exSecsPrev = getExSecs(prev);             // exercise time of prev set

        if(restSecs!=null && exSecsPrev!=null){
          // Both known — show rest + exercise time for prev set
          setsHtml+=`<div class="badge-row">
            <span class="badge badge-rest ${restClass(restSecs)}">rest ${fmtSecs(restSecs)}</span>
            <span class="badge badge-ex">set ${si} took ${fmtSecs(exSecsPrev)}</span>
          </div>`;
        } else if(restSecs!=null){
          // Rest known, ex time not
          setsHtml+=`<div class="badge-row"><span class="badge badge-rest ${restClass(restSecs)}">rest ${fmtSecs(restSecs)}</span></div>`;
        } else if(prev.completedAt && !st.startedAt){
          // Previous set done, this one not started — live rest counter
          setsHtml+=`<div class="badge-row"><span class="badge badge-rest" id="live-${ex.id}-${si}">resting...</span></div>`;
        }
      }

      // ── Set row ──
      const timeStr = st.startedAt ? fmtTime(st.startedAt) : '';
      const doneTimeStr = st.completedAt ? fmtTime(st.completedAt) : '';
      const timeLabel = st.startedAt
        ? `<span class="set-time">${timeStr}${st.completedAt?' → '+doneTimeStr:' → ...'}</span>`
        : '';

      // Determine what action button to show:
      // - Not started: show "▶ start" button
      // - Started but not done: show ✓ checkmark (normal)
      // - Done: show ✓ checkmark (filled)
      let actionBtn;
      if(!st.startedAt && !st.done){
        actionBtn=`<button class="start-set-btn" style="color:${ac};border-color:${ac}50" onclick="startSet(${ex.id},${si})">▶ start</button>`;
      } else {
        actionBtn=`<button class="chk-btn" style="background:${st.done?ac:'transparent'};border-color:${st.done?ac:'#334155'}"
          onclick="toggleDone(${ex.id},${si})">${st.done?'✓':''}</button>`;
      }

      setsHtml+=`<div class="swipe-wrap" id="swipewrap-${ex.id}-${si}">
        <div class="swipe-delete-bg" id="swipebg-${ex.id}-${si}" style="background:#7f1d1d">
          <span class="swipe-delete-label" id="swipelbl-${ex.id}-${si}">DELETE</span>
        </div>
        <div class="swipe-inner" id="swipeinner-${ex.id}-${si}"
          ontouchstart="swipeStart(event,${ex.id},${si})"
          ontouchmove="swipeMove(event,${ex.id},${si})"
          ontouchend="swipeEnd(event,${ex.id},${si})">
          <div class="set-row" style="background:${st.done?ac+'15':st.startedAt?ac+'07':'transparent'}" id="setrow-${ex.id}-${si}">
            <span class="set-num" style="color:${st.done?ac:st.startedAt?ac:'#475569'}">${si+1}</span>
            <input class="set-input" type="number" value="${st.w}" placeholder="wt"
              style="color:${ac};-webkit-text-fill-color:${ac}" oninput="updSet(${ex.id},${si},'w',this.value)">
            <input class="set-input" type="number" value="${st.r}" placeholder="reps"
              style="-webkit-text-fill-color:#e2e8f0" oninput="updSet(${ex.id},${si},'r',this.value)">
            ${actionBtn}
            ${timeLabel}
          </div>
        </div>
      </div>`;
    });

    return `<div class="card" id="card-${ex.id}">
      <div class="card-head">
        <div style="display:flex;align-items:flex-start;gap:4px">
          <div><div class="ex-name">${escapeHtml(ex.name)}</div>${ex.alt?`<div class="ex-alt">or: ${escapeHtml(ex.alt)}</div>`:''}</div>
          <button class="card-edit-btn" onclick="openEditModal(${ex.id})" title="Edit exercise">✏️</button>
        </div>
        <div class="ex-target" style="color:${ac}">${escapeHtml(buildTargetBadge(ex))}</div>
        ${suggestions[ex.id] ? `<div class="ex-suggest" style="color:${suggestions[ex.id].color};font-size:11px;margin-top:3px;font-weight:600;letter-spacing:.01em">next: ${escapeHtml(suggestions[ex.id].text)}</div>` : ''}
      </div>
      <div class="reorder-controls">
        <button class="reorder-arrow" onclick="moveExercise(${ex.id},-1)" ${prog.exercises[0].id===ex.id?'disabled':''}>↑ up</button>
        <button class="reorder-arrow" onclick="moveExercise(${ex.id},1)" ${prog.exercises[prog.exercises.length-1].id===ex.id?'disabled':''}>↓ down</button>
      </div>
      ${timingBar}
      <div class="set-header">
        <span class="sh" style="width:22px">#</span>
        <span class="sh" style="width:68px">WEIGHT</span>
        <span class="sh" style="width:68px">REPS</span>
        <span class="sh" style="width:60px">ACTION</span>
        <span class="sh" style="flex:1">TIME</span>
      </div>
      ${setsHtml}
      <button class="add-btn" style="color:${ac};border-color:${ac}40" onclick="addSet(${ex.id},${ex.dw})">+ set</button>
    </div>`;
  }).join('');

  // Buttons
  const sb=document.getElementById('save-btn');
  if(sb.textContent==='SAVE'){ sb.style.background=PROGRAM[currentDay].accent; sb.style.color='#0a0f1a'; }
  const cb=document.getElementById('csv-btn');
  cb.style.color=PROGRAM[currentDay].accent; cb.style.borderColor=PROGRAM[currentDay].accent+'50';
  const ab=document.getElementById('add-ex-btn');
  ab.style.color=PROGRAM[currentDay].accent; ab.style.borderColor=PROGRAM[currentDay].accent+'50';
  const msb=document.getElementById('modal-save-btn');
  msb.style.background=PROGRAM[currentDay].accent;

  startLiveTimer();
}

// ─── Reorder mode ─────────────────────────────────────────────────────────────
let reordering = false;

function toggleReorderMode(){
  reordering = !reordering;
  const btn = document.getElementById('reorder-btn');
  if(reordering){
    document.body.classList.add('reordering');
    btn.classList.add('active');
    btn.textContent = '✓ done';
  } else {
    document.body.classList.remove('reordering');
    btn.classList.remove('active');
    btn.textContent = '🔀 reorder';
    // Persist all sort_orders to Supabase
    persistOrder();
  }
}

function moveExercise(exId, delta){
  const exs = PROGRAM[currentDay].exercises;
  const idx = exs.findIndex(e=>e.id===exId);
  if(idx<0) return;
  const newIdx = idx + delta;
  if(newIdx < 0 || newIdx >= exs.length) return;
  // Swap
  [exs[idx], exs[newIdx]] = [exs[newIdx], exs[idx]];
  renderExercises();
}

async function persistOrder(){
  const exs = PROGRAM[currentDay].exercises;
  showToast('Saving order...','#60a5fa');
  try {
    const orders = exs.map((ex, i) => ({ id: ex.id, sort_order: i }));
    await apiPost({action:'reorder_exercises'}, { orders });
    showToast('Order saved!','#4ade80');
  } catch(e) {
    showToast('Order save failed: '+e.message,'#f87171');
  }
}

let modalEditId = null;

function openAddModal(){

function openEditModal(exId){
  const prog=PROGRAM[currentDay];

  modalMode='edit'; modalEditId=exId;

}

function closeModal(e){
  if(e && e.target!==document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

async function saveModal(){
  const name   = document.getElementById('modal-name').value.trim();
  const alt    = document.getElementById('modal-alt').value.trim();
  const ds     = parseInt(document.getElementById('modal-sets').value)||3;
  const rt     = document.getElementById('modal-reps').value.trim()||'8-10';
  const dw     = parseFloat(document.getElementById('modal-weight').value)||0;
  const u      = document.getElementById('modal-unit').value.trim()||'lb';
  if(!name){ document.getElementById('modal-name').style.borderColor='#f87171'; return; }

  const prog=PROGRAM[currentDay];

  if(modalMode==='add'){
    // Save first to get a real DB-assigned integer id
    const tempEx = {name,ds,rt,dw,u};
    if(alt) tempEx.alt = alt;
    const saved = await saveExercise(tempEx);
    if(!saved){
      document.getElementById('modal-overlay').classList.remove('open');
      return;
    }
    const newEx = {
      id: saved.id, name: saved.name, ds: saved.ds, rt: saved.rt,
      dw: parseFloat(saved.dw)||0, u: saved.u,
      _historicalNames: saved.historical_names || [],
    };
    if(saved.alt) newEx.alt = saved.alt;
    prog.exercises.push(newEx);
    if(!draft[newEx.id]) draft[newEx.id] = Array.from({length:ds},()=>({w:dw===0?'':String(dw),r:'',done:false,startedAt:null,completedAt:null}));
    saveDraftLocal();
    document.getElementById('modal-overlay').classList.remove('open');
    renderExercises();
    return;
  } else {
    const ex=prog.exercises.find(e=>e.id===modalEditId);
    if(ex){
      ex.name=name; ex.alt=alt||undefined; ex.ds=ds; ex.rt=rt; ex.dw=dw; ex.u=u;
      const cur=draft[ex.id]||[];
      while(cur.length<ds) cur.push({w:dw===0?'':String(dw),r:'',done:false,startedAt:null,completedAt:null});
      draft[ex.id]=cur;
      saveDraftLocal();
      document.getElementById('modal-overlay').classList.remove('open');
      renderExercises();
      // Persist update (server will append old name to historical_names if changed)
      saveExercise(ex);
      return;
    }
  }

  document.getElementById('modal-overlay').classList.remove('open');
  renderExercises();
}

async function deleteExerciseFromProgram(){
  if(modalEditId == null) return;
  const prog=PROGRAM[currentDay];
  const ex=prog.exercises.find(e=>e.id===modalEditId);
  if(!ex) return;
  if(!confirm(`Delete "${ex.name}" from ${currentDay}? Past sessions stay intact.`)) return;

  const idx=prog.exercises.findIndex(e=>e.id===modalEditId);
  if(idx>=0) prog.exercises.splice(idx,1);
  delete draft[modalEditId];

  document.getElementById('modal-overlay').classList.remove('open');
  renderExercises();

  try{
    await apiPost({action:'delete_exercise'}, {id: modalEditId});
    showToast('Exercise deleted','#f87171');
  }catch(e){ showToast('Delete failed: '+e.message,'#f87171'); }
}

// Persist a single exercise's customization
async function saveExercise(ex){
  const idx = PROGRAM[currentDay].exercises.findIndex(e => e.id === ex.id);
  const payload = {
    day: currentDay, name: ex.name, alt: ex.alt || null,
    ds: ex.ds, rt: ex.rt, dw: ex.dw, u: ex.u || 'lb',
    sort_order: idx >= 0 ? idx : 999,
  };
  // Only include id if it's already a real DB id (number). Omit for new exercises.
  if (typeof ex.id === 'number') payload.id = ex.id;
  try{
    return await apiPost({action:'save_exercise'}, payload);
  }catch(e){
    showToast('Save failed: '+e.message,'#f87171');
    return null;
  }
}

// Load all exercises from the canonical `exercises` table and populate PROGRAM
async function loadExercises(){
  try{
    const data = await apiGet({action:'get_exercises'});
    if(!Array.isArray(data)) return;

    // Reset all day buckets
    Object.keys(PROGRAM).forEach(day => { PROGRAM[day].exercises = []; });

    // Bucket by day, ordered by sort_order
    data.forEach(e => {
      if(!PROGRAM[e.day]) return;
      const ex = {
        id: e.id,                         // integer
        name: e.name,
        ds: e.ds,
        rt: e.rt,
        dw: parseFloat(e.dw) || 0,
        u: e.u || '',
        _historicalNames: Array.isArray(e.historical_names) ? e.historical_names : [],
      };
      if(e.alt) ex.alt = e.alt;
      PROGRAM[e.day].exercises.push(ex);
    });

    // Sort by sort_order (already ordered by API but be explicit)
    Object.values(PROGRAM).forEach(p => {
      p.exercises.sort((a,b) => {
        const av = data.find(d => d.id === a.id)?.sort_order ?? 999;
        const bv = data.find(d => d.id === b.id)?.sort_order ?? 999;
        return av - bv;
      });
    });
  }catch(e){ console.warn('loadExercises failed', e); }
}

function startLiveTimer(){
  if(liveTimer) clearInterval(liveTimer);
  liveTimer=setInterval(()=>{
    let anyLive=false;
    PROGRAM[currentDay].exercises.forEach(ex=>{
      const sets=draft[ex.id]||[];
      sets.forEach((st,si)=>{
        if(si>0){
          const prev=sets[si-1];
          const el=document.getElementById(`live-${ex.id}-${si}`);
          if(el && prev.completedAt && !st.startedAt){
            const s=getLiveRestSecs(prev);
            el.className=`badge badge-rest ${restClass(s)}`;
            el.textContent=`resting ${fmtSecs(s)}`;
            anyLive=true;
          }
        }
      });
    });
    if(!anyLive){ clearInterval(liveTimer); liveTimer=null; }
  },1000);
}

function renderHistory(){
  const list=document.getElementById('hist-list');
  const filtered=histData.filter(s=>s.day===histDay);
  if(!filtered.length){ list.innerHTML=`<div class="empty">No ${histDay} sessions found.</div>`; return; }
  const p=PROGRAM[histDay];
  list.innerHTML=filtered.map((sess,si)=>{
    const exHtml=p.exercises.map(ex=>{
      // Match by exercise_id (preferred) or by name + historical names (legacy fallback)
      const namesForEx = [ex.name, ...(ex._historicalNames || [])];
      const rows=(sess.rows||[]).filter(r =>
        r.exercise_id === ex.id ||
        (r.exercise_id == null && namesForEx.includes(r.exercise))
      ).sort((a,b)=>a.set_number-b.set_number);
      if(!rows.length) return '';
      // Compute stats from started_at / completed_at
      let statsStr='';
      const withTimes=rows.filter(r=>r.started_at&&r.completed_at);
      if(withTimes.length>=2){
        const allTs=withTimes.flatMap(r=>[new Date(r.started_at).getTime(),new Date(r.completed_at).getTime()]);
        const total=Math.round((Math.max(...allTs)-Math.min(...allTs))/1000);
        const rests=[];
        for(let i=1;i<rows.length;i++){
          if(rows[i-1].completed_at&&rows[i].started_at){
            rests.push(Math.round((new Date(rows[i].started_at)-new Date(rows[i-1].completed_at))/1000));
          }
        }
        const avg=rests.length?Math.round(rests.reduce((a,b)=>a+b,0)/rests.length):null;
        statsStr=` · ${fmtSecs(total)}${avg!=null?' · avg rest '+fmtSecs(avg):''}`;
      }
      const setsHtml=rows.map(r=>{
        const label=r.weight?`${r.weight}×${r.reps||'?'}`:r.reps?`${r.reps}reps`:`set${r.set_number}`;
        return `<span class="hist-set" style="background:${r.done?p.accent+'20':'rgba(255,255,255,.04)'};color:${r.done?p.accent:'#475569'};border:1px solid ${r.done?p.accent+'40':'rgba(255,255,255,.06)'}">${label}</span>`;
      }).join('');
      return `<div class="hist-ex">
        <div class="hist-ex-name">${escapeHtml(ex.name)}<span style="color:var(--muted);font-weight:400">${statsStr}</span><button class="prog-btn" onclick="event.stopPropagation();openChartModal(${ex.id})">📈</button></div>
        <div class="hist-sets">${setsHtml}</div>
      </div>`;
    }).join('');
    return `<div class="hist-card" onclick="toggleHist(${si})">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div class="hist-date">${fmtDate(sess.date)}</div>
          <div class="hist-day-lbl" style="color:${p.accent}">${sess.day} — ${p.label}</div></div>
        <div style="font-size:13px;color:var(--muted)" id="hchev-${si}">▼</div>
      </div>
      <div class="hist-body" id="hbody-${si}">${exHtml}</div>
    </div>`;
  }).join('');
}

function switchView(v){

  document.getElementById('view-log').style.display    =v==='log'?'':'none';
  document.getElementById('view-history').style.display=v==='history'?'':'none';

  renderAll();
}
async function selectDay(d){
  if(d===currentDay && currentView==='log') return;
  currentDay=d;
  draft={}; // clear stale draft immediately so we don't show prior day's data
  renderAll();
  await loadDraft();
}
function selectHistDay(d){ histDay=d; loadHistory(); renderAll(); }
function toggleHist(i){
  const b=document.getElementById(`hbody-${i}`),c=document.getElementById(`hchev-${i}`);
  c.textContent=b.classList.toggle('open')?'▲':'▼';
}

function updSet(id,si,f,v){ if(draft[id]){ draft[id][si][f]=v; saveDraftLocal(); } }

function startSet(id,si){
  // Stamp startedAt — rest ends here, exercise begins
  if(!draft[id]) return;
  draft[id][si].startedAt = new Date().toISOString();
  saveDraftLocal();
  renderExercises();
}

function toggleDone(id,si){
  if(!draft[id]) return;
  const st=draft[id][si];
  st.done=!st.done;
  if(st.done){
    // Stamp completedAt — exercise ends here, rest begins
    if(!st.startedAt) st.startedAt=new Date().toISOString(); // fallback if no start pressed
    st.completedAt=new Date().toISOString();
  } else {
    st.completedAt=null;
  }
  saveDraftLocal();
  renderExercises();
}

function addSet(id,dw){
  if(!draft[id]) draft[id]=[];
  draft[id].push({w:dw===0?'':String(dw),r:'',done:false,startedAt:null,completedAt:null});
  saveDraftLocal();
  renderExercises();
}
function rmSet(id,si){
  if(!draft[id]) return;
  draft[id].splice(si,1);
  saveDraftLocal();
  renderExercises();
}

// ─── Supabase ─────────────────────────────────────────────────────────────────
async function loadDraft(){
  document.getElementById('ex-loading').style.display='block';
  document.getElementById('ex-list').style.display='none';
  // 0. Unsaved local draft for this split+today wins (silent crash/refresh recovery)
  const cached=loadDraftLocal();
  if(cached && Object.keys(cached).length){
    draft=cached;
    document.getElementById('ex-loading').style.display='none';
    document.getElementById('ex-list').style.display='';
    renderExercises();
    showToast('Restored unsaved sets','#60a5fa');
    return;
  }
  try{
    // Progression suggestions from this split's history (non-fatal; powers badges + prefill)
    try{
      const hist=await apiGet({action:'get_by_day',day:currentDay});
      suggestions=computeSuggestions(hist||[],currentDay);
    }catch{ suggestions={}; }

    // 1. Try today's in-progress session first
    const todayRows=await apiGet({action:'get_today',day:currentDay,date:todayKey()});
    if(Array.isArray(todayRows)&&todayRows.length){
      draft=rowsToDraft(todayRows,currentDay);
    } else if(Object.keys(suggestions).length){
      // 2. No session today — prefill with next-target progression suggestions
      draft=suggestionsToFreshDraft(currentDay);
      showToast('Pre-filled with next-target suggestions \u2197','#60a5fa');
    } else {
      // 2. No session today — load last session for this day as pre-filled defaults
      try{
        const lastRows=await apiGet({action:'get_last_session',day:currentDay,date:todayKey()});
        if(Array.isArray(lastRows)&&lastRows.length){
          draft=rowsToFreshDraft(lastRows,currentDay);
          showToast('Pre-filled from last session \u2197','#60a5fa');
        } else {
          draft=makeDefaultDraft(currentDay);
        }
      }catch{ draft=makeDefaultDraft(currentDay); }
    }
  }catch{ draft=makeDefaultDraft(currentDay); }
  document.getElementById('ex-loading').style.display='none';
  document.getElementById('ex-list').style.display='';
  renderExercises();
}

async function loadHistory(){
  document.getElementById('hist-loading').style.display='block';
  document.getElementById('hist-list').innerHTML='';
  try{
    const rows=await apiGet({action:'get_by_day',day:histDay});
    const map={};
    (rows||[]).forEach(r=>{ const k=`${r.date}:${r.day}`; if(!map[k]) map[k]={date:r.date,day:r.day,rows:[]}; map[k].rows.push(r); });
    histData=Object.values(map).sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){ showToast('Failed: '+e.message,'#f87171',true); histData=[]; }
  document.getElementById('hist-loading').style.display='none';
  renderHistory();
}

async function saveSession(){
  const rows=draftToRows(currentDay,todayKey());
  if(!rows.length){
    showToast('Nothing to save \u2014 start (\u25b6) or check (\u2713) a set first','#fb923c');
    return;
  }
  const btn=document.getElementById('save-btn');
  btn.textContent='saving...'; btn.disabled=true;
  try{
    await apiPost({action:'save_session'},{date:todayKey(),day:currentDay,rows});
    btn.style.background='#14532d'; btn.style.color='#4ade80'; btn.textContent='SAVED ✓';
    clearDraftLocal();
    showToast('Saved to Supabase!');
    setTimeout(()=>{ btn.style.background=PROGRAM[currentDay].accent; btn.style.color='#0a0f1a'; btn.textContent='SAVE'; btn.disabled=false; },3000);
  }catch(e){
    btn.style.background='#7f1d1d'; btn.style.color='#fca5a5'; btn.textContent='FAILED';
    showToast('Save failed: '+e.message,'#f87171');
    setTimeout(()=>{ btn.style.background=PROGRAM[currentDay].accent; btn.style.color='#0a0f1a'; btn.textContent='SAVE'; btn.disabled=false; },4000);
  }
}

// Reliable mobile-safe download (clipboard truncates large payloads on iOS).
function downloadCSV(filename, text){
  try{
    const blob=new Blob([text],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    return true;
  }catch(e){ console.error('CSV download failed',e); return false; }
}

// Compact session detail for WHOOP's AI strain input (exercise / set / rep / load).
// Stays small enough that clipboard never truncates.
function copyForWhoop(){
  const rows=draftToRows(currentDay,todayKey());
  const order=[]; const byEx={};
  rows.forEach(r=>{
    const hasW=!(r.weight==null||r.weight==='');
    const hasR=!(r.reps==null||r.reps==='');
    if(!hasW && !hasR) return;                 // skip blank sets
    if(!(r.exercise in byEx)){ byEx[r.exercise]=[]; order.push(r.exercise); }
    const load=hasW?`${r.weight}lb`:'BW';
    const reps=hasR?r.reps:'?';
    byEx[r.exercise].push(`${load} x ${reps}`);
  });
  if(!order.length){ showToast('No sets logged yet','#fb923c'); return; }
  const head=`Iron Log — ${currentDay} — ${todayKey()}`;
  const body=order.map(ex=>`${ex}: ${byEx[ex].join(', ')}`);
  const text=[head,'',...body].join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    const b=document.getElementById('whoop-btn');
    if(b){ b.textContent='copied!'; setTimeout(()=>b.textContent='copy WHOOP',2500); }
    showToast('Copied for WHOOP');
  }).catch(()=>showToast('Copy failed','#f87171'));
}

function exportCSV(){
  const rows=draftToRows(currentDay,todayKey());
  const lines=['Date,Day,Exercise,Set,Weight,Reps,Done,StartedAt,CompletedAt'];
  rows.forEach(r=>lines.push(`${r.date},${r.day},"${r.exercise}",${r.set_number},${r.weight||''},${r.reps||''},${r.done?'yes':'no'},${r.started_at||''},${r.completed_at||''}`));
  const ok=downloadCSV(`ironlog_${currentDay}_${todayKey()}.csv`, lines.join('\n'));
  const b=document.getElementById('csv-btn');
  if(b){ b.textContent=ok?'downloaded!':'failed'; setTimeout(()=>b.textContent='export CSV',2500); }
  if(!ok) showToast('CSV download failed','#f87171');
}

function exportAllCSV(){
  const lines=['Date,Day,Exercise,Set,Weight,Reps,Done,StartedAt,CompletedAt'];
  histData.forEach(sess=>{
    const p=PROGRAM[sess.day]; if(!p) return;
    p.exercises.forEach(ex=>{
      const namesForEx = [ex.name, ...(ex._historicalNames || [])];
      (sess.rows||[]).filter(r =>
        r.exercise_id === ex.id ||
        (r.exercise_id == null && namesForEx.includes(r.exercise))
      ).sort((a,b)=>a.set_number-b.set_number).forEach(r=>{
        lines.push(`${r.date},${r.day},"${r.exercise}",${r.set_number},${r.weight||''},${r.reps||''},${r.done?'yes':'no'},${r.started_at||''},${r.completed_at||''}`);
      });
    });
  });
  const ok=downloadCSV(`ironlog_history_${todayKey()}.csv`, lines.join('\n'));
  showToast(ok?'History CSV downloaded!':'Download failed', ok?null:'#f87171', true);
}

// ─── WMA Chart ────────────────────────────────────────────────────────────────
let chartExName = '';
let chartExId = null;
let chartMetric = 'maxWeight';  // maxWeight | avgWeight | volume | maxReps
let chartWmaPeriod = 3;

function wma(data, period) {
  if (period < 2) return data.map(() => null);
  const result = [];
  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) { result.push(null); continue; }
    let num = 0, den = 0;
    for (let j = 0; j < period; j++) {
      const w = period - j;
      num += (data[i - j] ?? 0) * w;
      den += w;
    }
    result.push(Math.round(num / den * 10) / 10);
  }
  return result;
}

function buildChartData(exId, metric) {
  const rows = chartAllRows;
  if (!rows || !rows.length) return { labels: [], actual: [], dates: [] };

  // Match by exercise_id (preferred), fall back to current name + historical names for legacy rows
  const nameSet = new Set(chartExNames || []);

  // Group by date — pick best (top) weight per session for that exercise
  const byDate = {};
  rows.filter(r =>
    r.exercise_id === exId ||
    (r.exercise_id == null && nameSet.has(r.exercise))
  ).forEach(r => {
    const w = parseFloat(r.weight);
    const rep = parseFloat(r.reps) || 0;
    if (!byDate[r.date]) byDate[r.date] = { weights: [], reps: [], volume: 0, sets: 0 };
    if (!isNaN(w) && w !== 0) byDate[r.date].weights.push(w);
    if (rep > 0) byDate[r.date].reps.push(rep);
    if (!isNaN(w)) byDate[r.date].volume += Math.abs(w) * rep;
    byDate[r.date].sets++;
  });

  const sorted = Object.entries(byDate).sort((a, b) => a[0].localeCompare(b[0]));
  const labels = sorted.map(([d]) => fmtShort(d));
  const dates  = sorted.map(([d]) => d);
  let actual;
  if (metric === 'maxWeight') {
    actual = sorted.map(([, v]) => v.weights.length ? Math.max(...v.weights) : null);
  } else if (metric === 'avgWeight') {
    actual = sorted.map(([, v]) => v.weights.length ? Math.round(v.weights.reduce((a,b)=>a+b,0)/v.weights.length*10)/10 : null);
  } else if (metric === 'volume') {
    actual = sorted.map(([, v]) => Math.round(v.volume));
  } else {
    actual = sorted.map(([, v]) => v.reps.length ? Math.max(...v.reps) : null);
  }
  return { labels, actual, dates };
}

let chartAllRows = [];
let chartExNames = []; // [currentName, ...historicalNames]
async function openChartModal(exId) {
  // exId is the integer DB id; look up the exercise to get its display name + historical names
  const prog = PROGRAM[histDay];
  const ex = prog?.exercises.find(e => e.id === exId);
  const exName = ex?.name || `Exercise #${exId}`;
  chartExId    = exId;
  chartExName  = exName;
  chartExNames = [exName, ...(ex?._historicalNames || [])];
  chartMetric  = 'maxWeight';
  chartWmaPeriod = 3;
  try {
    const rows = await apiGet({ action: 'get_by_day', day: histDay });
    chartAllRows = rows || [];
  } catch { chartAllRows = []; }
  document.getElementById('chart-ex-title').textContent = exName;
  const subtitle = chartExNames.length > 1
    ? `${histDay} — incl. ${chartExNames.length - 1} prior name${chartExNames.length > 2 ? 's' : ''}`
    : `${histDay} — weight progression`;
  document.getElementById('chart-ex-sub').textContent = subtitle;
  document.getElementById('chart-modal-overlay').classList.add('open');
  updateChartControls();
  drawChart();
}

function closeChartModal() {
  document.getElementById('chart-modal-overlay').classList.remove('open');
}

function setChartMetric(m) {
  chartMetric = m;
  updateChartControls();
  drawChart();
}

function setWmaPeriod(p) {
  chartWmaPeriod = p;
  updateChartControls();
  drawChart();
}

function updateChartControls() {
  ['maxWeight','avgWeight','volume','maxReps'].forEach(m => {
    document.getElementById('ctrl-'+m)?.classList.toggle('active', m === chartMetric);
  });
  [0,3,5].forEach(p => {
    document.getElementById('wma-'+p)?.classList.toggle('active', p === chartWmaPeriod);
  });
  const legendWma = document.getElementById('legend-wma');
  if (legendWma) legendWma.style.display = chartWmaPeriod > 0 ? '' : 'none';
}

function segmentColor(v1, v2, threshold=0.5) {
  if (v1 == null || v2 == null) return '#475569';
  const delta = v2 - v1;
  if (delta > threshold)  return '#4ade80';  // green — up
  if (delta < -threshold) return '#f87171';  // red — down
  return '#475569';                          // gray — flat
}

function drawChart() {
  const canvas = document.getElementById('wma-canvas');
  if (!canvas) return;
  const { labels, actual, dates } = buildChartData(chartExId, chartMetric);
  const wmaLine = chartWmaPeriod > 0 ? wma(actual, chartWmaPeriod) : [];
  const n = labels.length;

  // Stats
  const validActual = actual.filter(v => v != null);
  const firstVal = validActual[0] ?? 0;
  const lastVal  = validActual[validActual.length - 1] ?? 0;
  const maxVal   = validActual.length ? Math.max(...validActual) : 0;
  const minVal   = validActual.length ? Math.min(...validActual) : 0;
  const trend    = lastVal - firstVal;
  const unit     = chartMetric === 'volume' ? 'lb·reps' : chartMetric === 'maxReps' ? 'reps' : 'lb';
  const unitSuffix = unit === 'lb' ? ' lb' : unit === 'reps' ? ' reps' : '';

  document.getElementById('chart-stats-row').innerHTML = `
    <div class="chart-stat"><div class="chart-stat-label">CURRENT</div><div class="chart-stat-val" style="color:#60a5fa">${lastVal}${unitSuffix}</div></div>
    <div class="chart-stat"><div class="chart-stat-label">PEAK</div><div class="chart-stat-val" style="color:#4ade80">${maxVal}${unitSuffix}</div></div>
    <div class="chart-stat"><div class="chart-stat-label">TREND</div><div class="chart-stat-val" style="color:${trend>0?'#4ade80':trend<0?'#f87171':'#475569'}">${trend>0?'+':''}${Math.round(trend*10)/10}${unitSuffix}</div><div class="chart-stat-sub">${n} sessions</div></div>
    <div class="chart-stat"><div class="chart-stat-label">RANGE</div><div class="chart-stat-val" style="font-size:13px;color:var(--muted)">${minVal}–${maxVal}</div></div>
  `;

  if (n === 0) {
    const ctx = canvas.getContext('2d');
    canvas.width = (canvas.offsetWidth || 600) * (window.devicePixelRatio || 1);
    canvas.height = 200 * (window.devicePixelRatio || 1);
    ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
    ctx.fillStyle = '#334155'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
    ctx.fillText('No data yet', (canvas.width/(window.devicePixelRatio||1))/2, 100);
    return;
  }

  // Canvas setup
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth || 600;
  const H = 200;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const PAD = { top: 20, right: 16, bottom: 36, left: 48 };
  const cw = W - PAD.left - PAD.right;
  const ch = H - PAD.top - PAD.bottom;

  const allVals = [...actual, ...wmaLine].filter(v => v != null);
  const lo = Math.min(...allVals) * 0.97;
  const hi = Math.max(...allVals) * 1.03;
  const range = hi - lo || 1;
  const yScale = v => PAD.top + ch - ((v - lo) / range) * ch;
  const xScale = i => PAD.left + (n === 1 ? cw / 2 : (i / (n - 1)) * cw);

  // Grid lines
  ctx.lineWidth = 1;
  const gridLines = 4;
  for (let g = 0; g <= gridLines; g++) {
    const y = PAD.top + (g / gridLines) * ch;
    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + cw, y); ctx.stroke();
    ctx.fillStyle = '#475569'; ctx.font = '9px monospace'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(hi - (g / gridLines) * range), PAD.left - 6, y + 4);
  }

  // ── COLOR-CODED AREA FILL per segment ─────────────────────────────────────
  // Build list of non-null points
  const pts = actual.map((v, i) => v != null ? { v, i } : null).filter(Boolean);
  for (let p = 0; p < pts.length - 1; p++) {
    const a = pts[p], b = pts[p + 1];
    const col = segmentColor(a.v, b.v);
    // Transparent fill under this segment
    const fillCol = col === '#4ade80' ? 'rgba(74,222,128,' : col === '#f87171' ? 'rgba(248,113,113,' : 'rgba(71,85,105,';
    ctx.beginPath();
    ctx.moveTo(xScale(a.i), yScale(a.v));
    ctx.lineTo(xScale(b.i), yScale(b.v));
    ctx.lineTo(xScale(b.i), PAD.top + ch);
    ctx.lineTo(xScale(a.i), PAD.top + ch);
    ctx.closePath();
    ctx.fillStyle = fillCol + '0.12)';
    ctx.fill();
  }

  // ── COLOR-CODED LINE segments ──────────────────────────────────────────────
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  for (let p = 0; p < pts.length - 1; p++) {
    const a = pts[p], b = pts[p + 1];
    const col = segmentColor(a.v, b.v);
    ctx.strokeStyle = col;
    ctx.beginPath();
    ctx.moveTo(xScale(a.i), yScale(a.v));
    ctx.lineTo(xScale(b.i), yScale(b.v));
    ctx.stroke();
  }

  // ── Dots — colored by direction toward next point ──────────────────────────
  pts.forEach(({ v, i }, pi) => {
    const next = pts[pi + 1];
    const prev = pts[pi - 1];
    // Color based on next segment direction, fallback to prev
    const col = next ? segmentColor(v, next.v) : prev ? segmentColor(prev.v, v) : '#475569';
    ctx.beginPath();
    ctx.arc(xScale(i), yScale(v), 4, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    // White center
    ctx.beginPath();
    ctx.arc(xScale(i), yScale(v), 2, 0, Math.PI * 2);
    ctx.fillStyle = '#0d1525';
    ctx.fill();
    // Value label on dots (only if 6 or fewer points — otherwise too crowded)
    if (n <= 6) {
      ctx.fillStyle = col;
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(v, xScale(i), yScale(v) - 8);
    }
  });

  // ── WMA line — dashed amber ────────────────────────────────────────────────
  if (chartWmaPeriod > 0 && wmaLine.length) {
    const wmaPts = wmaLine.map((v, i) => v != null ? { v, i } : null).filter(Boolean);
    ctx.setLineDash([5, 3]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#f59e0b';
    ctx.beginPath();
    wmaPts.forEach(({ v, i }, pi) => {
      pi === 0 ? ctx.moveTo(xScale(i), yScale(v)) : ctx.lineTo(xScale(i), yScale(v));
    });
    ctx.stroke();
    ctx.setLineDash([]);
    // WMA dots
    wmaPts.forEach(({ v, i }) => {
      ctx.beginPath();
      ctx.arc(xScale(i), yScale(v), 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b'; ctx.fill();
    });
  }

  // ── X-axis labels ──────────────────────────────────────────────────────────
  ctx.fillStyle = '#475569'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
  ctx.setLineDash([]);
  const step = n <= 6 ? 1 : Math.ceil(n / 6);
  for (let i = 0; i < n; i += step) {
    ctx.fillText(labels[i], xScale(i), PAD.top + ch + 18);
  }
}

// ─── Swipe-to-delete ─────────────────────────────────────────────────────────
const _swipe = {};  // track per-row swipe state

const SWIPE_PEEK    = 72;   // px revealed before "peek" — shows DELETE label
const SWIPE_COMMIT  = 140;  // px — cross this threshold and release = delete

function swipeStart(e, id, si) {
  const key = `${id}-${si}`;
  _swipe[key] = {
    startX: e.touches[0].clientX,
    startY: e.touches[0].clientY,
    dx: 0,
    committed: false,
    cancelled: false,
  };
}

function swipeMove(e, id, si) {
  const key = `${id}-${si}`;
  const s = _swipe[key];
  if (!s || s.cancelled) return;

  const dx = e.touches[0].clientX - s.startX;
  const dy = e.touches[0].clientY - s.startY;

  // If moving more vertically than horizontally, cancel swipe (allow scroll)
  if (!s.dirLocked) {
    if (Math.abs(dy) > Math.abs(dx) + 4) { s.cancelled = true; return; }
    if (Math.abs(dx) > 6) s.dirLocked = true;
    else return;
  }

  // Only allow left swipe (negative dx)
  if (dx > 0) { resetSwipe(id, si); return; }

  e.preventDefault(); // prevent scroll while swiping horizontally

  const travel = Math.min(Math.abs(dx), SWIPE_COMMIT + 20);
  s.dx = travel;
  s.committed = travel >= SWIPE_COMMIT;

  const inner = document.getElementById(`swipeinner-${id}-${si}`);
  const bg    = document.getElementById(`swipebg-${id}-${si}`);
  const lbl   = document.getElementById(`swipelbl-${id}-${si}`);
  if (!inner) return;

  inner.style.transition = 'none';
  inner.style.transform  = `translateX(-${travel}px)`;

  // Background: red intensifies as you drag further
  const progress = Math.min(travel / SWIPE_COMMIT, 1);
  const r = Math.round(127 + (248 - 127) * progress);
  const g = Math.round(29  + (113 - 29)  * (1 - progress));
  const b = Math.round(29  + (113 - 29)  * (1 - progress));
  if (bg) bg.style.background = `rgb(${r},${g},${b})`;

  // Show DELETE label once past peek threshold
  if (lbl) lbl.style.opacity = travel > SWIPE_PEEK ? '1' : '0';

  // Shake/bounce at commit threshold to signal "let go to delete"
  if (s.committed && !s.shook) {
    s.shook = true;
    inner.style.transform = `translateX(-${SWIPE_COMMIT + 6}px)`;
  }
}

function swipeEnd(e, id, si) {
  const key = `${id}-${si}`;
  const s = _swipe[key];
  if (!s || s.cancelled) return;

  if (s.committed) {
    // Animate out then delete
    const inner = document.getElementById(`swipeinner-${id}-${si}`);
    const wrap  = document.getElementById(`swipewrap-${id}-${si}`);
    if (inner) {
      inner.style.transition = 'transform .18s ease-in';
      inner.style.transform  = 'translateX(-110%)';
    }
    if (wrap) {
      wrap.style.transition  = 'max-height .2s ease .15s, opacity .15s ease .15s';
      wrap.style.overflow    = 'hidden';
      wrap.style.maxHeight   = wrap.offsetHeight + 'px';
      requestAnimationFrame(() => {
        wrap.style.maxHeight = '0';
        wrap.style.opacity   = '0';
      });
    }
    setTimeout(() => rmSet(id, si), 340);
  } else {
    resetSwipe(id, si);
  }
  delete _swipe[key];
}

function resetSwipe(id, si) {
  const inner = document.getElementById(`swipeinner-${id}-${si}`);
  const bg    = document.getElementById(`swipebg-${id}-${si}`);
  const lbl   = document.getElementById(`swipelbl-${id}-${si}`);
  if (inner) { inner.style.transition = 'transform .2s cubic-bezier(.25,.46,.45,.94)'; inner.style.transform = 'translateX(0)'; }
  if (bg)    bg.style.background = '#7f1d1d';
  if (lbl)   lbl.style.opacity = '0';
}
